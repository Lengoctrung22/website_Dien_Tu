# ==============================================================================
# CẤU HÌNH NGINX PHÂN LUỒNG HỆ THỐNG TECHGEAR PRO (SUBDOMAIN REVERSE PROXY)
# ==============================================================================
# Kiến trúc:
# 1. techgear.vn (Storefront)            -> Next.js Frontend (127.0.0.1:3000)
# 2. admin.techgear.vn (Super Admin)      -> Next.js Frontend (127.0.0.1:3000) -> tự vào /admin
# 3. orders.techgear.vn (Nhân viên Đơn)   -> Next.js Frontend (127.0.0.1:3000) -> tự vào /admin/orders
# 4. warehouse.techgear.vn (Nhân viên Kho) -> Next.js Frontend (127.0.0.1:3000) -> tự vào /admin/inventory
# 5. api.techgear.vn (Backend API)        -> Express.js Backend (127.0.0.1:5000)
#
# * Tất cả các Subdomain đều là Origin độc lập, giúp cô lập 100% localStorage và Cookie,
#   cho phép mở nhiều tài khoản cùng lúc trên 1 trình duyệt mà không bị ghi đè!
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. UPSTREAM DEFINITION
# ------------------------------------------------------------------------------
upstream nextjs_upstream {
    server 127.0.0.1:3000;
    keepalive 64;
}

upstream express_upstream {
    server 127.0.0.1:5000;
    keepalive 64;
}

# ------------------------------------------------------------------------------
# 2. STOREFRONT - KHÁCH HÀNG MUA SẮM (techgear.vn & techgear.local)
# ------------------------------------------------------------------------------
server {
    listen 80;
    server_name techgear.vn www.techgear.vn techgear.local;

    client_max_body_size 20M;

    location / {
        proxy_pass http://nextjs_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }

    # Proxy API requests to backend
    location /api/ {
        proxy_pass http://express_upstream/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

